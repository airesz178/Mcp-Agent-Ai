name: Windows preview

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-preview'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - run: node scripts/smoke-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cos-fusion-windows-preview
          path: release/*.zip
          if-no-files-found: error

  publish-preview:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cos-fusion-windows-preview
          path: artifacts
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $asset = Get-ChildItem -LiteralPath artifacts -Filter '*.zip' -File | Select-Object -First 1
          if (-not $asset) { throw 'No release ZIP artifact was downloaded' }
          gh release create $env:GITHUB_REF_NAME $asset.FullName --verify-tag --prerelease --title "COS Fusion $env:GITHUB_REF_NAME (preview)" --notes "Experimental Windows x64 preview. Unsigned; read README-FIRST.txt before use."
