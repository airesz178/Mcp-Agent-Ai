name: Android native APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-preview.yml'

permissions:
  contents: write

concurrency:
  group: android-preview-release
  cancel-in-progress: false

jobs:
  apk:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'ci: publish Android preview release'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Configure Android NDK for Tauri ARM64
        shell: pwsh
        run: |
          rustup target add aarch64-linux-android
          $ndk = Get-ChildItem -LiteralPath (Join-Path $env:ANDROID_HOME 'ndk') -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $ndk) { throw 'Android NDK not installed on build runner' }
          "NDK_HOME=$($ndk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Prepare checksum-pinned Gradle via alternate mirrors
        shell: pwsh
        run: |
          npx tauri android init --ci --skip-targets-install
          if ($LASTEXITCODE -ne 0) { throw 'Tauri Android project initialization failed' }
          $wrapperProperties = Join-Path $PWD 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties'
          if (-not (Test-Path -LiteralPath $wrapperProperties)) { throw 'Gradle wrapper properties missing' }
          $properties = @(Get-Content -LiteralPath $wrapperProperties | Where-Object {
            $_ -notmatch '^(networkTimeout|distributionUrl|distributionSha256Sum)='
          })
          # SHA-256 for the official Gradle 9.6.1 binary distribution.
          # Fail closed if any alternate mirror serves different bytes.
          $properties += 'distributionSha256Sum=9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14'
          $properties += 'networkTimeout=120000'
          $wrapper = Join-Path $PWD 'src-tauri/gen/android/gradlew.bat'
          $ready = $false
          $mirrors = @(
            'https://mirrors.huaweicloud.com/gradle/gradle-9.6.1-bin.zip',
            'https://mirrors.aliyun.com/gradle/distributions/v9.6.1/gradle-9.6.1-bin.zip',
            'https://mirrors.nju.edu.cn/gradle/gradle-9.6.1-bin.zip',
            'https://downloads.gradle.org/distributions/gradle-9.6.1-bin.zip'
          )
          foreach ($mirror in $mirrors) {
            $url = $mirror.Replace(':', '\:')
            @($properties) + "distributionUrl=$url" |
              Set-Content -LiteralPath $wrapperProperties -Encoding utf8
            Write-Host "Checking pinned Gradle 9.6.1 from $mirror"
            & $wrapper --version
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 3
          }
          if (-not $ready) { throw 'No checksum-valid Gradle mirror was reachable' }
          # The generated buildSrc project resolves Kotlin compiler artifacts
          # separately; include a public Maven mirror before Maven Central.
          $buildSrc = Join-Path $PWD 'src-tauri/gen/android/buildSrc/build.gradle.kts'
          if (-not (Test-Path -LiteralPath $buildSrc)) { throw 'Gradle buildSrc missing' }
          $script = Get-Content -LiteralPath $buildSrc -Raw
          if ($script -notmatch 'maven.aliyun.com') {
            $script = $script.Replace('    mavenCentral()',
              '    maven { url = uri("https://maven.aliyun.com/repository/public") }' + "`n" + '    mavenCentral()')
            $script | Set-Content -LiteralPath $buildSrc -Encoding utf8
          }
      - name: Build one native Android APK
        shell: pwsh
        run: |
          $env:GRADLE_OPTS = '-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000'
          $built = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm run native:android
            if ($LASTEXITCODE -eq 0) { $built = $true; break }
            Write-Warning "APK build attempt $attempt failed; retrying transient dependency downloads"
            if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (-not $built) { throw 'Android native build failed after three attempts' }
      - uses: actions/upload-artifact@v4
        with:
          name: Mcp-Agent-Ai-Android
          path: release/Mcp-Agent-Ai-Android.apk
          if-no-files-found: error
      - name: Verify APK and publish one preview release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $artifact = Join-Path $PWD 'release/Mcp-Agent-Ai-Android.apk'
          if (-not (Test-Path -LiteralPath $artifact)) { throw 'Verified APK was not staged' }
          $buildTools = Get-ChildItem -LiteralPath (Join-Path $env:ANDROID_HOME 'build-tools') -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $buildTools) { throw 'Android build tools unavailable' }
          $signer = Join-Path $buildTools.FullName 'apksigner.bat'
          & $signer verify --verbose $artifact
          if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed' }
          $sha256 = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash
          $notes = @(
            'Mcp Agent Ai v0.2.2 Android preview 2 for ARM64 devices (Android 8.0+).',
            '',
            'Install the APK and open Settings → Setup to review permissions, sign in to ChatGPT or select an API provider, and configure the optional MCP Core Tunnel.',
            'Includes Android chat, Plan/Goal, Prime Sub-agents, native private browser, optional tool approvals, skills, and bundled plugin install/disable/uninstall controls.',
            'New: per-project SSH host-key pinning and real process receipts, optional permissioned Termux RUN_COMMAND Node/npm/SSH bridge, plus a read-only official plugin/app update check.',
            '',
            'This preview APK is debug signed. A differently signed installation cannot be updated in place; preserve your app data before changing signing identities.',
            'Node/npm are not bundled. Termux and its RUN_COMMAND permission, user consent and separate Node/npm/SSH installation are required. SSH access requires a real native client, pinned host identity and authorized key. Dynamic third-party plugin installation and auto-updates are not included.',
            '',
            'APK SHA-256: ' + $sha256,
            'Documentation and screenshots: https://github.com/airesz178/Mcp-Agent-Ai#readme'
          )
          $notesFile = Join-Path $env:RUNNER_TEMP 'android-preview-release-notes.md'
          $notes | Set-Content -LiteralPath $notesFile -Encoding UTF8
          gh release create v0.2.2-android-preview.2 $artifact --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'Mcp Agent Ai v0.2.2 · Android Preview 2' --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw 'GitHub prerelease creation failed' }
